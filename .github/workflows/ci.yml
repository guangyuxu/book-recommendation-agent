# CI: three parallel jobs — lint (ruff + mypy + codespell + pip-audit),
# test (pytest + coverage against Postgres), docker (image build check).
# Each job runs inside a Python 3.13 container for sandbox isolation.

name: CI

on:
  push:
    branches: ["master", "dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel earlier runs on the same branch/PR when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: python:3.13-slim
    env:
      # Place the uv cache inside the workspace so actions/cache can reach it
      # from both the runner and the container.
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v6
        with:
          path: .cache/uv
          key: uv-lint-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-lint-${{ runner.os }}-

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type-check with mypy
        # Config-driven: reads [tool.mypy] in pyproject.toml (strict = true, files = src/agent).
        run: uv run mypy

      - name: Check spelling
        run: |
          uv run codespell --skip ./.git --ignore-words .codespellignore README.md
          uv run codespell --skip ./.git --ignore-words .codespellignore src/

      - name: Security scan (pip-audit)
        run: |
          uv pip install pip-audit
          uv run pip-audit

  # ── 2. Test ─────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: python:3.13-slim
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # unit_tests/conftest.py uses setdefault, so this wins over sqlite:///:memory:
      # and tests run against real Postgres.
      BOOK_AGENT_DATABASE_URL: postgresql+psycopg://ci:ci@postgres:5432/ci?options=-csearch_path%3Dbook_agent
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v6
        with:
          path: .cache/uv
          key: uv-test-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-test-${{ runner.os }}-

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      # init_db() is idempotent: CREATE SCHEMA IF NOT EXISTS + create_all skips existing tables.
      - name: Set up database
        run: uv run python -c "from agent.db import init_db; init_db()"

      - name: Run tests with coverage
        run: |
          uv run coverage run -m pytest tests/
          uv run coverage report
          uv run coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.xml

  # ── 3. Docker build ──────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set image tag
        id: tag
        run: echo "tag=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: docker build -t book-recommendation-agent:${{ steps.tag.outputs.tag }} .
