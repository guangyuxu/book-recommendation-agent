# CI: lint (ruff), type-check (mypy), spelling (codespell), and unit tests against Postgres.
# The job runs inside a Python 3.13 container (sandbox isolation); Postgres runs as a service
# container and is reachable at hostname "postgres" within the job.

name: CI

on:
  push:
    branches: ["master", "dev"]
  pull_request:
  workflow_dispatch: # Allows triggering the workflow manually in GitHub UI

permissions:
  contents: read

# If another push to the same PR or branch happens while this workflow is still running,
# cancel the earlier run in favor of the next run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    # Run every step inside a Python 3.13 container for reproducible sandbox isolation.
    container:
      image: python:3.13-slim

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # BOOK_AGENT_DATABASE_URL is visible to all steps; unit_tests/conftest.py uses setdefault
    # so this wins over the sqlite:///:memory: fallback and tests run against real Postgres.
    env:
      BOOK_AGENT_DATABASE_URL: postgresql+psycopg://ci:ci@postgres:5432/ci?options=-csearch_path%3Dbook_agent

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      # uv sync installs the project + the dev group (ruff, mypy, codespell, pytest, coverage).
      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type-check with mypy
        # Config-driven: reads [tool.mypy] in pyproject.toml (the single source of truth --
        # strict = true, files = src/agent). No --strict flag or path args, so CI, the
        # Makefile, and the IDE all enforce the exact same standard.
        run: uv run mypy

      - name: Check spelling
        run: |
          uv run codespell --skip ./.git --ignore-words .codespellignore README.md
          uv run codespell --skip ./.git --ignore-words .codespellignore src/

      # Create the book_agent schema and all tables before running tests.
      # init_db() is idempotent (CREATE SCHEMA IF NOT EXISTS + create_all skips existing tables).
      - name: Set up database
        run: uv run python -c "from agent.db import init_db; init_db()"

      - name: Run tests with pytest
        run: uv run pytest tests/unit_tests
