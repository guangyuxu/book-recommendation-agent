apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-recommendation-agent
  namespace: book-agent
  labels:
    app: book-recommendation-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book-recommendation-agent
  template:
    metadata:
      labels:
        app: book-recommendation-agent
    spec:
      containers:
        - name: agent
          image: book-recommendation-agent:0.0.2
          # Use the local image already loaded into minikube; never pull from a remote registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            # This Secret is generated from .env (see the Makefile) and holds all connection
            # info: ANTHROPIC / LANGSMITH / BOOK_AGENT_DATABASE_URL / REDIS_URI / DATABASE_URI
            - secretRef:
                name: agent-env
          readinessProbe:
            httpGet:
              path: /ok
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ok
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
