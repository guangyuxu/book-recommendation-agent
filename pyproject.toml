[project]
name = "agent"
version = "0.0.1"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "advanced-alchemy>=1.11.0",
    "groq>=1.5.0",
    "langchain>=1.3.11",
    "langchain-anthropic>=1.4.8",
    "langgraph>=1.2.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0",
    "typing-extensions>=4.0",
]

# Dev + test tooling (uv installs these by default). anyio + pytest are test-only;
# coverage measures unit-test coverage; langgraph-cli runs the local dev server / Studio;
# mypy + ruff are the linters; codespell is the spell checker; pip-audit is the dependency
# vulnerability scanner; pre-commit runs the local git hooks. `make ci` runs them all so a
# fresh `uv sync` gives you everything the GitHub CI pipeline needs to run locally.
[dependency-groups]
dev = [
    "anyio>=4.14.1",
    "codespell>=2.4.2",
    "coverage[toml]>=7.15.0",
    "langgraph-cli[inmem]>=0.4.30",
    "mypy>=2.2.0",
    "pip-audit>=2.7.3",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.agent", "agent"]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.mypy]
# Single source of truth for type checking: the mypy CLI (`mypy`), CI, the Makefile, and
# PyCharm's Mypy plugin ALL invoke bare `mypy` and read this section, so every entry point
# enforces the exact same standard -- no scattered `--strict` flags or path args to drift.
# PyCharm's *built-in* type inspection does not understand langgraph's structural State
# protocols (TypedDictLikeV1/V2) and red-lines valid `StateGraph(FlowState)` / `add_node(...)`
# calls; disable that inspection and rely on mypy.
strict = true
files = ["src/agent"]
mypy_path = "src"
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
warn_redundant_casts = true
warn_unused_ignores = true  # would have flagged the wrong `# type: ignore[arg-type]`

[tool.pytest.ini_options]
# Eval strategy markers -- one per strategy filename prefix under evals/<tree>/<node>/. The
# regression gate (eval_regression/test_regression.py) tags each discovered node eval with its
# strategy marker, so `pytest -m classify` / `-m judge` select a whole category.
markers = [
    "classify: node evals that assert structured output against gold labels",
    "judge: node evals scored by an LLM judge against a rubric",
    "regression: the aggregate threshold gate",
]

[tool.coverage.run]
# `coverage run -m pytest` (see `make coverage`) auto-scopes to the package, so no --source flag
# is needed. Only unit tests run under coverage; integration/eval are opt-in and hit the network.
source = ["src/agent"]

[tool.coverage.report]
show_missing = true
# Floor so coverage cannot silently rot; `coverage report` (via `make coverage`/`make ci`) exits
# nonzero below this. Kept just under the current number -- raise it as coverage improves.
fail_under = 70

[tool.ruff]
exclude = [".cache", ".venv", "venv"]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "S",    # flake8-bandit -- security (the project stores children's PII; see CLAUDE.md)
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
    # Docstrings are optional per-symbol: add them where they add value (model-facing
    # Pydantic schemas, non-obvious "why"), not as filler over self-explanatory names.
    # Module/package docstrings (D100/D104) and format rules (D2xx/D4xx, D401) still apply.
    "D101",  # undocumented public class
    "D102",  # undocumented public method
    "D103",  # undocumented public function
    "D105",  # undocumented magic method
    "D106",  # undocumented public nested class
    "D107",  # undocumented __init__
]
[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert` (S101) and may hardcode fake secrets/tokens (S105-S107) as
# fixtures; those bandit rules are noise there, not in src/.
"tests/*" = ["D", "UP", "S101", "S105", "S106", "S107"]
# The eval regression gate asserts thresholds; `assert` is expected there too.
"eval_regression/*" = ["S101"]
[tool.ruff.lint.pydocstyle]
convention = "google"
