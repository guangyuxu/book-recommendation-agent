[project]
name = "agent"
version = "0.0.1"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.11",
    "langchain-anthropic>=1.4.8",
    "langgraph>=1.2.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0",
    "typing-extensions>=4.0",
]

# Dev + test tooling (uv installs these by default). anyio + pytest are test-only;
# langgraph-cli runs the local dev server / Studio; mypy + ruff are the linters.
[dependency-groups]
dev = [
    "anyio>=4.14.1",
    "langgraph-cli[inmem]>=0.4.30",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.agent", "agent"]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
    # Docstrings are optional per-symbol: add them where they add value (model-facing
    # Pydantic schemas, non-obvious "why"), not as filler over self-explanatory names.
    # Module/package docstrings (D100/D104) and format rules (D2xx/D4xx, D401) still apply.
    "D101",  # undocumented public class
    "D102",  # undocumented public method
    "D103",  # undocumented public function
    "D105",  # undocumented magic method
    "D106",  # undocumented public nested class
    "D107",  # undocumented __init__
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"
